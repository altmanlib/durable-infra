name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # "Version Packages" PR
      id-token: write # npm Trusted Publishing (OIDC); also enables provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # reads the packageManager field
      # Trusted Publishing needs npm CLI >= 11.5.1 and Node >= 22.14.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: changesets/action@v2
        with:
          publish-script: bun run release
          create-github-releases: true
