version: 2
updates:
  # npm dependencies are not managed here: Dependabot's bun updater only reads
  # bun.lock lockfileVersion 1, while bun >= 1.4 writes version 2.
  # npm dependencies are upgraded by hand, about once a month, with `bun outdated`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
